<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-shecodes-weather-app</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Enter a city.."
            required
            id="search-form-input"
            class="search-form-input"
          />
          <input type="submit" value="search" class="search-form-button" />
        </form>
        <main>
          <div class="weather-app-data">
            <div>
              <h1 class="weather-app-city" id="city">Paris</h1>
              <p class="weather-app-details">
                Sunday 13:40, clear sky
                <br />
                Humidity:<strong>39%</strong>, Wind:<strong>0.45km/h</strong>
              </p>
            </div>
            <div class="weather-app-temperature">
              <div class="weather-app-icon">🌤</div>
              <div class="weather-app-value" id="temperature">34</div>
              <div class="weather-app-unit">°C</div>
            </div>
          </div>
        </main>
      </header>
      <footer>
        coded by
        <a href="https://github.com/nwabundo94-code" target="_blank">
          Theresa Onuorah</a
        >, code hosted by
        <a
          href="https://github.com/nwabundo94-code/my-shecode-weather-app"
          target="_blank"
        >
          Github</a
        >
        and website hosted
        <a
          href="https://my-shecodes-weatherapplication.netlify.app/"
          target="_blank"
        >
          on Netlify</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
